name: Peek
options:
  bundleIdPrefix: com.a8media
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  PeekCore:
    path: Packages/PeekCore
targets:
  Peek:
    type: application
    platform: iOS
    sources: [Peek]
    dependencies:
      - package: PeekCore
    # XcodeGen writes this file. Git ignores it (*.plist). The build adds the INFOPLIST_KEY_* settings to it.
    # It exists because a file type can not be declared with a build setting.
    info:
      path: Config/Peek-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: false
        # The app uses only the encryption built into iOS, so App Store Connect does not ask for each build.
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.a8media.peek.pack
            UTTypeDescription: PEEK Pose Pack
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [peekpack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PEEK Pose Pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.a8media.peek.pack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a8media.peek
  PeekTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeekTests
      # The local store for the StoreKit tests. The app bundle does not ship it.
      - path: Config/Products.storekit
        buildPhase: resources
    dependencies:
      - target: Peek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a8media.peek.tests
schemes:
  Peek:
    build:
      targets:
        Peek: all
        PeekTests: [test]
    run:
      # Xcode runs use the local store: the products and prices of Config/Products.storekit.
      storeKitConfiguration: Config/Products.storekit
    test:
      targets:
        - PeekTests
        - package: PeekCore/PeekCoreTests
